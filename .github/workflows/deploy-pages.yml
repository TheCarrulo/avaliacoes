name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git log -1 only needs the commit being deployed
          fetch-depth: 1

      - name: Stamp last update from latest commit
        run: |
          date=$(TZ=Europe/Lisbon git log -1 --format=%cd --date=format-local:%Y-%m-%d)
          sed -i "s/^const ATUALIZADO = \"[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]\";/const ATUALIZADO = \"${date}\";/" data.js
          grep -q "^const ATUALIZADO = \"${date}\";" data.js
          echo "Stamped ATUALIZADO=${date}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
