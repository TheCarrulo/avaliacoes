<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Próximos testes e avaliações do Agrupamento de Escolas Afonso de Paiva.">
  <meta name="theme-color" content="#f7f5f2">
  <link rel="icon" href="favicon.ico">
  <title>Testes — Agrupamento Afonso Paiva</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f5f2;
      --ink: #1a1814;
      --muted: #8a8580;
      --accent: #1a5fc8;
      --line: #e0ddd8;
      --card: #ffffff;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 1.5rem 6rem;
    }

    header {
      width: 100%;
      max-width: 540px;
      margin-bottom: 3.5rem;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 1.1rem;
      margin-bottom: 1rem;
    }

    .logo-wrap img {
      width: 160px;
      height: auto;
    }

    .school {
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.1;
      color: var(--ink);
    }

    h1 span {
      color: var(--accent);
    }

    .divider {
      width: 32px;
      height: 2px;
      background: var(--accent);
      margin-top: 1rem;
    }

    .list {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .item {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 1.4rem 1.6rem;
      display: grid;
      grid-template-columns: auto 1px 1fr auto;
      align-items: stretch;
      gap: 1.2rem;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
      transition: border-color 0.2s;
    }

    .sep {
      background: var(--line);
      align-self: stretch;
    }

    .item:hover {
      border-color: var(--accent);
    }

    .item:first-child { border-radius: 6px 6px 0 0; }
    .item:last-child  { border-radius: 0 0 6px 6px; }
    .item:only-child  { border-radius: 6px; }

    .item:nth-child(1) { animation-delay: 0.15s; }
    .item:nth-child(2) { animation-delay: 0.25s; }
    .item:nth-child(3) { animation-delay: 0.35s; }
    .item:nth-child(4) { animation-delay: 0.45s; }
    .item:nth-child(5) { animation-delay: 0.55s; }

    .date-block {
      text-align: center;
      min-width: 52px;
    }

    .day-num {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      line-height: 1;
      color: var(--ink);
    }

    .month-str {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    .info { display: flex; align-items: center; justify-content: center; }

    .subject {
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--ink);
      text-align: center;
    }

    .weekday {
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    .badge {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 20px;
    }

    .countdown {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 4px;
      text-align: center;
    }

    .countdown.soon {
      color: var(--accent);
    }

    .countdown.urgent {
      color: #c0392b;
      font-weight: 400;
    }

    .badge.urgent {
      border-color: #c0392b;
      color: #c0392b;
    }

    footer {
      margin-top: 1rem;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 0.5s ease 0.7s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      h1 { font-size: 1.7rem; }
      .item { padding: 1.1rem 1.2rem; gap: 1rem; }
    }
  </style>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8BE45TC82J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8BE45TC82J');
  </script>
</head>
<body>

<header>
  <div class="logo-wrap">
    <img src="logo.webp" alt="Logo Afonso Paiva" width="320" height="245">
    <div class="logo-text">
      <p class="school"></p>
      <h1><span>Avaliações</span></h1>
    </div>
  </div>
  <div class="divider"></div>
</header>

<div class="list" id="list"></div>

<a href="arquivo.html" style="display:inline-block;margin-top:1.5rem;font-size:0.7rem;font-weight:400;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);text-decoration:none;border:1px solid var(--accent);padding:5px 14px;border-radius:20px;opacity:0;animation:fadeUp 0.5s ease 0.8s forwards;">Arquivo de avalia&ccedil;&otilde;es →</a>
<footer id="footer"></footer>

<script src="data.js"></script>
<script>
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);

  const list = document.getElementById("list");

  TESTES
    .map(t => Object.assign({}, t, partesData(t.data)))
    .filter(t => t.date >= hoje)
    .sort((a, b) => a.date - b.date)
    .forEach(t => {
      const diff = Math.round((t.date - hoje) / 86400000);

      let cdText = "";
      let cdClass = "";
      if (diff < 0)       { cdText = "realizado"; }
      else if (diff === 0){ cdText = "hoje";          cdClass = "urgent"; }
      else if (diff === 1){ cdText = "amanhã";        cdClass = "urgent"; }
      else if (diff <= 2) { cdText = `em ${diff} dias`; cdClass = "urgent"; }
      else if (diff <= 7) { cdText = `em ${diff} dias`; cdClass = "soon"; }
      else                { cdText = `em ${diff} dias`; }

      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <div class="date-block">
          <div class="day-num">${String(t.dia).padStart(2,"0")}</div>
          <div class="month-str">${t.mes}</div>
          <div class="weekday">${t.semana}</div>
        </div>
        <div class="sep"></div>
        <div class="info">
          <div class="subject">${t.disciplina}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <div class="badge ${cdClass}">${t.tipo || "Teste"}</div>
          <div class="countdown ${cdClass}">${cdText}</div>
        </div>
      `;
      list.appendChild(item);
    });

  document.getElementById("footer").textContent =
    "Atualizado em " + textoAtualizado();
</script>

</body>
</html>
