<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Próximos testes e avaliações do Agrupamento de Escolas Afonso de Paiva.">
  <meta name="theme-color" content="#f7f5f2">
  <link rel="icon" href="favicon.ico">
  <title>Testes — Agrupamento Afonso Paiva</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f5f2;
      --ink: #1a1814;
      --muted: #8a8580;
      --accent: #1a5fc8;
      --line: #e0ddd8;
      --card: #ffffff;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 1.5rem 6rem;
    }

    header {
      width: 100%;
      max-width: 540px;
      margin-bottom: 2.2rem;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 1.1rem;
      margin-bottom: 1rem;
    }

    .logo-wrap img {
      width: 160px;
      height: auto;
    }

    .school {
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.1;
      color: var(--ink);
    }

    h1 span {
      color: var(--accent);
    }

    .divider {
      width: 32px;
      height: 2px;
      background: var(--accent);
      margin-top: 1rem;
    }

    .list {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .item {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 1.4rem 1.6rem;
      display: grid;
      grid-template-columns: auto 1px 1fr auto;
      align-items: stretch;
      gap: 1.2rem;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
      transition: border-color 0.2s;
    }

    .sep {
      background: var(--line);
      align-self: stretch;
    }

    .item:hover {
      border-color: var(--accent);
    }

    .item:first-child { border-radius: 6px 6px 0 0; }
    .item:last-child  { border-radius: 0 0 6px 6px; }
    .item:only-child  { border-radius: 6px; }

    .item:nth-child(1) { animation-delay: 0.15s; }
    .item:nth-child(2) { animation-delay: 0.25s; }
    .item:nth-child(3) { animation-delay: 0.35s; }
    .item:nth-child(4) { animation-delay: 0.45s; }
    .item:nth-child(5) { animation-delay: 0.55s; }

    .date-block {
      text-align: center;
      min-width: 52px;
    }

    .day-num {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      line-height: 1;
      color: var(--ink);
    }

    .month-str {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    .info { display: flex; align-items: center; justify-content: center; }

    .subject {
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--ink);
      text-align: center;
    }

    .weekday {
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    .badge {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 20px;
    }

    .countdown {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 4px;
      text-align: center;
    }

    .countdown.soon {
      color: var(--accent);
    }

    .countdown.urgent {
      color: #c0392b;
      font-weight: 400;
    }

    .badge.urgent {
      border-color: #c0392b;
      color: #c0392b;
    }

    footer {
      margin-top: 1rem;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 0.5s ease 0.7s forwards;
    }

    .calendar {
      width: 100%;
      max-width: 540px;
      margin-bottom: 3.2rem;
      opacity: 0;
      animation: fadeUp 0.55s ease 0.08s forwards;
    }

    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }

    .cal-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.55rem;
      font-weight: 400;
      line-height: 1.1;
      text-align: center;
      color: var(--ink);
    }

    .cal-btn {
      font-family: inherit;
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 5px 12px;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .cal-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    .cal-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .cal-frame {
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--line);
    }

    .cal-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 1px;
      table-layout: fixed;
      background: var(--line);
    }

    .cal-table th {
      background: var(--bg);
      color: var(--muted);
      font-size: 0.55rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      padding: 0.45rem 0.1rem;
    }

    .cal-table td {
      background: var(--card);
      vertical-align: top;
      height: 4.6rem;
      padding: 0.32rem 0.26rem 0.38rem;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .cal-table td.outside {
      background: #f3f1ed;
    }

    .cal-table td.has-test {
      background: #e8f0fb;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .cal-table td.today {
      box-shadow: inset 0 0 0 1.5px var(--accent);
    }

    .cal-table td.today.has-test {
      box-shadow: inset 3px 0 0 var(--accent), inset 0 0 0 1.5px var(--accent);
    }

    .cal-num {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      line-height: 1;
      color: var(--ink);
      width: 1.4rem;
      height: 1.4rem;
      display: grid;
      place-items: center;
      margin-bottom: 0.18rem;
    }

    .cal-table td.today .cal-num {
      background: var(--accent);
      color: #fff;
      border-radius: 50%;
    }

    .cal-test + .cal-test {
      margin-top: 0.32rem;
      padding-top: 0.28rem;
      border-top: 1px solid var(--line);
    }

    .cal-test .cal-subject {
      font-size: 0.62rem;
      font-weight: 400;
      line-height: 1.25;
      color: var(--ink);
    }

    .cal-test .cal-tipo {
      margin-top: 1px;
      font-size: 0.5rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.25;
      color: var(--accent);
    }

    /* On a phone the seven columns are too narrow for subject names.
       The grid stays; each week's tests are repeated in a full-width row. */
    .cal-notes { display: none; }

    .cal-note {
      display: flex;
      align-items: baseline;
      gap: 0.55rem;
      padding: 0.32rem 0;
    }

    .cal-note + .cal-note { border-top: 1px solid var(--line); }

    .cal-note-day {
      font-family: 'DM Serif Display', serif;
      font-size: 1.15rem;
      line-height: 1;
      color: var(--accent);
      min-width: 1.45rem;
    }

    .cal-note-text {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.12rem 0.45rem;
      min-width: 0;
    }

    .cal-note .cal-subject {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.3;
      color: var(--ink);
    }

    .cal-note .cal-tipo {
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.3;
      color: var(--accent);
    }

    .cal-empty {
      margin-top: 0.85rem;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .cal-nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-areas: "title title" "prev next";
        row-gap: 0.7rem;
        column-gap: 0.5rem;
      }
      .cal-title { grid-area: title; font-size: 1.4rem; }
      #cal-prev { grid-area: prev; justify-self: start; }
      #cal-next { grid-area: next; justify-self: end; }

      .cal-test { display: none; }
      .cal-notes { display: table-row; }
      .cal-table td { height: 2.45rem; padding: 0.28rem 0.08rem; }
      .cal-notes td {
        height: auto;
        padding: 0.1rem 0.75rem 0.2rem;
        background: #f4f7fc;
      }
      .cal-num { margin-bottom: 0; }
    }

    @media (max-width: 420px) {
      body { padding-left: 0.7rem; padding-right: 0.7rem; }
      h1 { font-size: 1.7rem; }
      .item { padding: 1.1rem 1.2rem; gap: 1rem; }
      .cal-table th { font-size: 0.5rem; letter-spacing: 0.04em; padding: 0.4rem 0; }
      .cal-num { font-size: 0.95rem; width: 1.25rem; height: 1.25rem; }
      .cal-btn { font-size: 0.55rem; padding: 4px 8px; letter-spacing: 0.08em; }
      .cal-note .cal-subject { font-size: 0.82rem; }
    }
  </style>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8BE45TC82J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8BE45TC82J');
  </script>
</head>
<body>

<header>
  <div class="logo-wrap">
    <img src="logo.webp" alt="Logo Afonso Paiva" width="320" height="245">
    <div class="logo-text">
      <p class="school"></p>
      <h1><span>Avaliações</span></h1>
    </div>
  </div>
  <div class="divider"></div>
</header>

<section class="calendar" id="calendar" aria-labelledby="cal-title">
  <div class="cal-nav">
    <button type="button" class="cal-btn" id="cal-prev" aria-label="Mês anterior">&larr; Anterior</button>
    <h2 class="cal-title" id="cal-title" aria-live="polite"></h2>
    <button type="button" class="cal-btn" id="cal-next" aria-label="Mês seguinte">Seguinte &rarr;</button>
  </div>
  <div class="cal-frame" id="cal-frame"></div>
  <p class="cal-empty" id="cal-empty" hidden>Sem avaliações neste mês.</p>
</section>

<div class="list" id="list"></div>

<a href="arquivo.html" style="display:inline-block;margin-top:1.5rem;font-size:0.7rem;font-weight:400;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);text-decoration:none;border:1px solid var(--accent);padding:5px 14px;border-radius:20px;opacity:0;animation:fadeUp 0.5s ease 0.8s forwards;">Arquivo de avalia&ccedil;&otilde;es →</a>
<footer id="footer"></footer>

<script src="data.js"></script>
<script>
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);

  const list = document.getElementById("list");

  TESTES
    .map(t => Object.assign({}, t, partesData(t.data)))
    .filter(t => t.date >= hoje)
    .sort((a, b) => a.date - b.date)
    .forEach(t => {
      const diff = Math.round((t.date - hoje) / 86400000);

      let cdText = "";
      let cdClass = "";
      if (diff < 0)       { cdText = "realizado"; }
      else if (diff === 0){ cdText = "hoje";          cdClass = "urgent"; }
      else if (diff === 1){ cdText = "amanhã";        cdClass = "urgent"; }
      else if (diff <= 2) { cdText = `em ${diff} dias`; cdClass = "urgent"; }
      else if (diff <= 7) { cdText = `em ${diff} dias`; cdClass = "soon"; }
      else                { cdText = `em ${diff} dias`; }

      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <div class="date-block">
          <div class="day-num">${String(t.dia).padStart(2,"0")}</div>
          <div class="month-str">${t.mes}</div>
          <div class="weekday">${t.semana}</div>
        </div>
        <div class="sep"></div>
        <div class="info">
          <div class="subject">${t.disciplina}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <div class="badge ${cdClass}">${t.tipo || "Teste"}</div>
          <div class="countdown ${cdClass}">${cdText}</div>
        </div>
      `;
      list.appendChild(item);
    });

  document.getElementById("footer").textContent =
    "Atualizado em " + textoAtualizado();

  // Monday-first month grid. Short weekday labels come from the pt-PT long
  // names (Intl "short" is too wide for a seven-column header).
  const WEEKDAY_SHORT = {
    "segunda-feira": "seg",
    "terça-feira": "ter",
    "quarta-feira": "qua",
    "quinta-feira": "qui",
    "sexta-feira": "sex",
    "sábado": "sáb",
    "domingo": "dom",
  };

  const weekdayHeaders = Array.from({ length: 7 }, (_, i) => {
    const ref = new Date(2024, 0, 1 + i); // 2024-01-01 is a Monday
    const longName = ref.toLocaleDateString("pt-PT", { weekday: "long" });
    return WEEKDAY_SHORT[longName] || longName.slice(0, 3);
  });

  const testsByIso = new Map();
  TESTES.forEach(teste => {
    const bucket = testsByIso.get(teste.data);
    if (bucket) bucket.push(teste);
    else testsByIso.set(teste.data, [teste]);
  });

  const calTitle = document.getElementById("cal-title");
  const calFrame = document.getElementById("cal-frame");
  const calEmpty = document.getElementById("cal-empty");
  const view = { year: hoje.getFullYear(), month: hoje.getMonth() };

  function isoDate(year, monthIndex, day) {
    const month = String(monthIndex + 1).padStart(2, "0");
    const dayText = String(day).padStart(2, "0");
    return year + "-" + month + "-" + dayText;
  }

  function shiftMonth(delta) {
    const next = new Date(view.year, view.month + delta, 1);
    view.year = next.getFullYear();
    view.month = next.getMonth();
    renderCalendar();
  }

  function renderCalendar() {
    const monthLabel = new Date(view.year, view.month, 1)
      .toLocaleDateString("pt-PT", { month: "long", year: "numeric" });
    calTitle.textContent = monthLabel;

    const firstWeekday = new Date(view.year, view.month, 1).getDay();
    const startPad = (firstWeekday + 6) % 7;
    const daysInMonth = new Date(view.year, view.month + 1, 0).getDate();
    const weeks = Math.ceil((startPad + daysInMonth) / 7);

    const table = document.createElement("table");
    table.className = "cal-table";
    table.setAttribute("aria-label", monthLabel);

    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    weekdayHeaders.forEach(name => {
      const th = document.createElement("th");
      th.scope = "col";
      th.textContent = name;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    let testCount = 0;

    for (let week = 0; week < weeks; week++) {
      const row = document.createElement("tr");
      const weekTests = [];
      for (let weekday = 0; weekday < 7; weekday++) {
        const dayNum = week * 7 + weekday - startPad + 1;
        const cell = document.createElement("td");

        if (dayNum < 1 || dayNum > daysInMonth) {
          cell.className = "outside";
          cell.setAttribute("aria-hidden", "true");
          row.appendChild(cell);
          continue;
        }

        const key = isoDate(view.year, view.month, dayNum);
        const tests = testsByIso.get(key) || [];
        const isToday = view.year === hoje.getFullYear()
          && view.month === hoje.getMonth()
          && dayNum === hoje.getDate();

        cell.className = [
          tests.length ? "has-test" : "",
          isToday ? "today" : "",
        ].filter(Boolean).join(" ");
        if (isToday) cell.setAttribute("aria-current", "date");

        const num = document.createElement("div");
        num.className = "cal-num";
        num.textContent = String(dayNum);
        cell.appendChild(num);

        tests.forEach(teste => {
          testCount += 1;
          weekTests.push({ dayNum, teste });
          const block = document.createElement("div");
          block.className = "cal-test";
          const subject = document.createElement("div");
          subject.className = "cal-subject";
          subject.textContent = teste.disciplina;
          const tipo = document.createElement("div");
          tipo.className = "cal-tipo";
          tipo.textContent = teste.tipo || "Teste";
          block.appendChild(subject);
          block.appendChild(tipo);
          cell.appendChild(block);
        });

        row.appendChild(cell);
      }
      tbody.appendChild(row);

      if (weekTests.length) {
        const notes = document.createElement("tr");
        notes.className = "cal-notes";
        const notesCell = document.createElement("td");
        notesCell.colSpan = 7;
        weekTests.forEach(({ dayNum, teste }) => {
          const note = document.createElement("div");
          note.className = "cal-note";
          const day = document.createElement("span");
          day.className = "cal-note-day";
          day.textContent = String(dayNum);
          const text = document.createElement("span");
          text.className = "cal-note-text";
          const subject = document.createElement("span");
          subject.className = "cal-subject";
          subject.textContent = teste.disciplina;
          const tipo = document.createElement("span");
          tipo.className = "cal-tipo";
          tipo.textContent = teste.tipo || "Teste";
          text.appendChild(subject);
          text.appendChild(tipo);
          note.appendChild(day);
          note.appendChild(text);
          notesCell.appendChild(note);
        });
        notes.appendChild(notesCell);
        tbody.appendChild(notes);
      }
    }

    table.appendChild(tbody);
    calFrame.replaceChildren(table);
    calEmpty.hidden = testCount > 0;
  }

  document.getElementById("cal-prev").addEventListener("click", () => shiftMonth(-1));
  document.getElementById("cal-next").addEventListener("click", () => shiftMonth(1));
  renderCalendar();
</script>

</body>
</html>
